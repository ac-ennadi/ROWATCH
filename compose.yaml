services:
  rowatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: rowatch:latest
    restart: unless-stopped
    ports:
      - "${ROWATCH_PORT:-5000}:5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY to a random 32+ character value in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET to a different random 32+ character value in .env}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/instance/rowatch.db}"
      ROWATCH_DISABLE_PURGE: "${ROWATCH_DISABLE_PURGE:-0}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      ROWATCH_ADMIN_USERNAME: "${ROWATCH_ADMIN_USERNAME:-}"
      ROWATCH_ADMIN_EMAIL: "${ROWATCH_ADMIN_EMAIL:-}"
      ROWATCH_ADMIN_PASSWORD: "${ROWATCH_ADMIN_PASSWORD:-}"
      ROWATCH_SESSION_DAYS: "${ROWATCH_SESSION_DAYS:-7}"
      ROWATCH_SESSION_STALE_SECONDS: "${ROWATCH_SESSION_STALE_SECONDS:-30}"
      ROWATCH_TRACKING_CONSENT_VERSION: "${ROWATCH_TRACKING_CONSENT_VERSION:-2026-08-25}"
      ROWATCH_CORS_ENABLED: "${ROWATCH_CORS_ENABLED:-0}"
      ROWATCH_TRUSTED_ORIGINS: "${ROWATCH_TRUSTED_ORIGINS:-}"
    volumes:
      - rowatch_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  rowatch_data:
